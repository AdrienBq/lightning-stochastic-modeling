project_uri: 'src/stages'                                                           # the path of the directory where each stage script is saved
log_artifacts: false                                                                # whether to log the output file/directory as artifact
log_models: false                                                                   # whether to log the output model
lazy: true                                                                          # skip a stage whose code state + parameters + input checksums match a
                                                                                    # previously recorded successful run whose outputs are still present and
                                                                                    # byte-identical on disk. Safe and worthwhile here because prepare is
                                                                                    # expensive. Overridable per stage with a `lazy:` key.
                                                                                    # NOTE: the cache keys on the whole-repo dirty diff, so COMMIT before
                                                                                    # running -- any uncommitted edit busts every entry.
ensure_determinism: false                                                           # when a stage is executed with unchanged code+inputs+params but produces a
                                                                                    # different output, that non-determinism is warned about; set true to raise.
                                                                                    # Overridable per stage (`ensure-determinism:`).
banner: true                                                                        # set false to disable the start-up welcome banner entirely
description: 'MC-dropout stochastic parameterization of lightning from ERA5 reanalysis'

# =====================================================================================================================
# Pipeline: MC-DROPOUT parameterization of lightning from ERA5 reanalysis predictors.
#
# Same diagnostic ERA5 -> lightning mapping and same target as config/deterministic_unet/deterministic_unet.yaml, but STOCHASTIC: dropout
# stays active at inference, so M forward passes give M ensemble members. MCDropoutEnsembleModule re-expresses those
# passes in the shared ensemble contract (observation / prediction = ensemble mean / ensemble_members [B,M,H,W]),
# which is what lets this family feed the SHARED streaming ensemble scores rather than a bespoke accumulator.
#
# TWO MODES, selected by whether an upstream checkpoint is supplied to the TUNING stage:
#   FROM SCRATCH (UPSTREAM_MODEL unset) -- the full two-phase fit:
#     phase 1 (train)    : deterministic single forward pass, dropout as a plain regularizer.
#     phase 2 (finetune) : MC-dropout active, probabilistic loss (CRPS family) at a reduced LR, so the ensemble
#                          DISTRIBUTION is calibrated rather than just its mean being accurate.
#   WARM START (UPSTREAM_MODEL set) -- phase 1 is REPLACED by the deterministic U-net: its weights are loaded into an
#     identically-shaped MC-dropout U-net and ONLY the finetuning phase runs. The deterministic model has already
#     solved the point-prediction problem, so the stochastic fit starts from it rather than relearning it.
#
#     export UPSTREAM_MODEL=outputs/deterministic_unet/best/best_model.ckpt
#
#   The upstream comes from config/deterministic_unet/deterministic_unet.yaml -- run that pipeline first.
#
# !! Note how this DIFFERS from the diffusion family, which reads the same environment variable at a different stage.
# !! Diffusion's residual mode needs the upstream PREDICTION, so prepare_regression materializes it as per-day
# !! upstream/<date>.npy maps and appends it as a conditioning channel. MC-dropout needs the upstream WEIGHTS, which
# !! is a checkpoint read once at fit time -- so the switch sits on `tune` and prepare_regression below is the plain
# !! full-target preparation, unchanged from the deterministic pipeline.
#
# Warm-starting requires the upstream to be shape- and norm-compatible, which is why
# config/deterministic_unet/search_space.yaml fixes `unet.normalization: group`. Both search spaces are group-norm,
# so any best_model.ckpt of that family loads here. A mismatch in any architecture field is a hard error at load
# time, never a silent partial load.
#
# Both modes live in config/mc_dropout/search_space.yaml (`loss` and the nested `finetuning` block); see its header
# for which knobs are searched in which mode.
#
# Stages are the same shared five as every other family; only `model-family`, `model-config` and the upstream switch
# differ.
#
# Environment: export DATA_ROOT before running (the dataset root holding metadata.json, metadata.csv, samples/), and
# UPSTREAM_MODEL for the warm-start mode -- leave it unset to fit from scratch.
# =====================================================================================================================

stages:
    - setup:
        outputs: outputs
        prepared: outputs/mc_dropout/prepared
        tuning: outputs/mc_dropout/tuning
        best: outputs/mc_dropout/best
        evaluation: outputs/mc_dropout/evaluation
        reports: outputs/mc_dropout/reports

    # ------------------------------------------------------------------------------------------------------------
    # 1) Data preparation -- byte-for-byte the same call as the deterministic pipeline (the prepared data is
    # family-agnostic; only the model differs). Kept as a separate directory so the two pipelines can run and be
    # cached independently.
    # ------------------------------------------------------------------------------------------------------------
    - prepare_regression:
        data-path: '{{$DATA_ROOT}}'         # dataset root; NEVER hardcode a path
        split-config: config/split/split.yaml     # the shared year-based split (see CLAUDE.md "Data")
        output-path: outputs/mc_dropout/prepared/daily_lightning_hours
        mode: daily                         # daily | hourly
        feature-aggregation: hourly_stack   # stacks 24 hourly maps into C*24 input channels
        target-variable: daily_lightning_hours
        features: MU_LI,MU_MIXR,RH_500850,cp,lsm
        hourly-threshold: 2                 # >= 2 strokes for an hour to count (single-stroke denoising); baked
                                            # into the target, so changing it means re-preparing and re-training
        overwrite: false
        materialize-features: true
        feature-dtype: float16

    # ------------------------------------------------------------------------------------------------------------
    # 2) Hyperparameter tuning -- the UNIFIED stage, and where THIS family's upstream switch lives. `model-family:
    # mc_dropout` selects the two-phase fit; the search space additionally fixes normalization to group norm and
    # forces dropout > 0 (see that file for why both are hard constraints for MC inference).
    # ------------------------------------------------------------------------------------------------------------
    - tune:
        model-family: mc_dropout
        model-type: mc_dropout              # tagged on the mlflow run for ease of access
        input-path: outputs/mc_dropout/prepared/daily_lightning_hours
        model-config: config/mc_dropout/search_space.yaml
        metrics-config: config/eval/metrics.yaml # supplies the climatology baseline behind the
                                            # mae_cond_ss_climatology selection component
        output-path: outputs/mc_dropout/tuning
        metrics-path: outputs/mc_dropout/tuning/best_trial_metrics.json
        upstream-model-path: '{{$UPSTREAM_MODEL}}'  # a deterministic_unet checkpoint -> WARM START: load its weights,
                                            # skip phase 1, run the finetuning phase only. Unset/empty -> the full
                                            # two-phase fit from scratch. Unlike diffusion, this is the model's
                                            # WEIGHTS, not a conditioning channel, so it is read here and not by
                                            # prepare_regression. In warm-start mode the search space's `unet:` block
                                            # is ignored (architecture comes from the checkpoint) and
                                            # finetuning.enabled is forced true.
        n-trials: 30                        # fewer than the deterministic family: each trial pays for two phases
                                            # (one, in warm-start mode -- but a warm-started trial is also cheaper)
        sampler: tpe                        # random | tpe (tpe requires optuna)
        max-epochs: 50                      # phase 1 only, so IGNORED in warm-start mode; phase 2 always uses
                                            # search_space.yaml -> finetuning.max_epochs
        early-stopping-patience: 10
        pruning: true
        accelerator: auto
        devices: 1
        num-workers: 8
        progress-bar: true
        feature-stats-days: 256

    # ------------------------------------------------------------------------------------------------------------
    # 3) Retrain the winning configuration (both phases, or the finetuning phase alone in upstream mode). The
    # selection metric/mode are read back from source-path/best_trial.json, so they cannot disagree with the sweep.
    # ------------------------------------------------------------------------------------------------------------
    - retrain_best:
        model-family: mc_dropout
        model-type: mc_dropout
        source-path: outputs/mc_dropout/tuning
        input-path: outputs/mc_dropout/prepared/daily_lightning_hours
        metrics-config: config/eval/metrics.yaml
        output-path: outputs/mc_dropout/best
        metrics-path: outputs/mc_dropout/best/best_trial_metrics.json
        max-epochs: 80
        early-stopping-patience: 10
        accelerator: auto
        devices: 1
        num-workers: 8
        progress-bar: true

    # ------------------------------------------------------------------------------------------------------------
    # 4) Evaluation and reporting -- THE common evaluation, the same stage and the same metric suite as every other
    # family. With ensemble-size > 1 the checkpoint is wrapped in MCDropoutEnsembleModule, so the ensemble group of
    # config/eval/metrics.yaml (CRPS, almost-fair CRPS, spread-skill ratio, rank histogram) is populated here whereas it
    # is skipped for the deterministic family.
    # ------------------------------------------------------------------------------------------------------------
    - evaluate_regression:
        input-path: outputs/mc_dropout/prepared/daily_lightning_hours
        model-path: outputs/mc_dropout/best/best_model.ckpt
        output-path: outputs/mc_dropout/evaluation
        metrics-config: config/eval/metrics.yaml
        metrics-path: outputs/mc_dropout/evaluation/test_metrics.json
        report-path: outputs/mc_dropout/reports
        split: test                         # valid | test
        baselines: zero,climatology         # no persistence: a diagnostic parameterization has no past observation
        ensemble-size: 32                   # MC forward passes per item. Point / skill / categorical / calibration
                                            # scores use the ensemble MEAN; spatial-structure scores are POOLED over
                                            # all N x M members. Must be >= 2 (spread_skill_sums uses ddof=1).
        accelerator: auto
        devices: 1
        num-workers: 8
        batch-size: 16
        progress-bar: true                  # an ensemble run is much slower than a single-sample eval

tags:                                                                               # tags to be applied to the run
    version: 1.0
    experiment: mc_dropout
