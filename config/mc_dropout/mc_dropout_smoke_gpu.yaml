project_uri: 'src/stages'                                                           # the path of the directory where each stage script is saved
log_artifacts: false                                                                # whether to log the output file/directory as artifact
log_models: false                                                                   # whether to log the output model
lazy: false                                                                         # NEVER cache a smoke run: the point is to execute every stage
ensure_determinism: false
banner: true
description: 'MC-dropout -- GPU smoke tier'

# =====================================================================================================================
# GPU SMOKE TIER of config/mc_dropout/mc_dropout.yaml. Read that file for what the pipeline does and why, and
# config/deterministic_unet/deterministic_unet_smoke_gpu.yaml for the full list of smoke overrides and their rationale.
#
# 18 mid-July days (10 train / 4 valid / 4 test), 2 trials, 1 epoch per phase, accelerator gpu, bf16-mixed,
# ensemble-size 5. This tier exercises the two-phase fit AND the ensemble path under mixed precision, which is the
# combination the CPU tier cannot reach.
#
# WARM-START MODE in the smoke tier: leave UPSTREAM_MODEL unset to smoke the from-scratch two-phase fit. To smoke the
# warm-start path instead, run config/deterministic_unet/deterministic_unet_smoke_gpu.yaml first and point
# UPSTREAM_MODEL at ITS checkpoint -- NOT at a real one, whose feature normalization was fitted on different days:
#
#     export UPSTREAM_MODEL=outputs/deterministic_unet_smoke_gpu/best/best_model.ckpt
#
# Environment: export DATA_ROOT before running; UPSTREAM_MODEL only for the warm-start smoke variant.
# =====================================================================================================================

stages:
    - setup:
        outputs: outputs
        prepared: outputs/mc_dropout_smoke_gpu/prepared
        tuning: outputs/mc_dropout_smoke_gpu/tuning
        best: outputs/mc_dropout_smoke_gpu/best
        evaluation: outputs/mc_dropout_smoke_gpu/evaluation
        reports: outputs/mc_dropout_smoke_gpu/reports

    - prepare_regression:
        data-path: '{{$DATA_ROOT}}'
        split-config: config/split/split_smoke_gpu.yaml
        output-path: outputs/mc_dropout_smoke_gpu/prepared/daily
        mode: daily
        feature-aggregation: hourly_stack
        features: MU_LI,MU_MIXR,RH_500850,cp,lsm
        hourly-threshold: 2
        overwrite: false
        materialize-features: true
        feature-dtype: float16

    - tune:
        model-family: mc_dropout
        model-type: mc_dropout
        input-path: outputs/mc_dropout_smoke_gpu/prepared/daily
        model-config: config/mc_dropout/search_space.yaml
        metrics-config: config/eval/metrics.yaml
        output-path: outputs/mc_dropout_smoke_gpu/tuning
        metrics-path: outputs/mc_dropout_smoke_gpu/tuning/best_trial_metrics.json
        upstream-model-path: '{{$UPSTREAM_MODEL}}'  # unset/empty -> from-scratch two-phase smoke fit
        n-trials: 2
        sampler: tpe
        max-epochs: 1                       # phase 1 only (ignored in warm-start mode); phase 2 always uses
                                            # search_space.yaml -> finetuning.max_epochs
        early-stopping-patience: 1
        pruning: false
        accelerator: gpu
        devices: 1
        num-workers: 8
        precision: bf16-mixed
        progress-bar: true
        feature-stats-days: 10              # cannot exceed the 10 train days of the smoke split

    - retrain_best:
        model-family: mc_dropout
        model-type: mc_dropout
        source-path: outputs/mc_dropout_smoke_gpu/tuning
        input-path: outputs/mc_dropout_smoke_gpu/prepared/daily
        metrics-config: config/eval/metrics.yaml
        output-path: outputs/mc_dropout_smoke_gpu/best
        metrics-path: outputs/mc_dropout_smoke_gpu/best/best_trial_metrics.json
        max-epochs: 1
        early-stopping-patience: 1
        accelerator: gpu
        devices: 1
        num-workers: 8
        precision: bf16-mixed
        progress-bar: true

    - evaluate_regression:
        input-path: outputs/mc_dropout_smoke_gpu/prepared/daily
        model-path: outputs/mc_dropout_smoke_gpu/best/best_model.ckpt
        output-path: outputs/mc_dropout_smoke_gpu/evaluation
        metrics-config: config/eval/metrics.yaml
        metrics-path: outputs/mc_dropout_smoke_gpu/evaluation/test_metrics.json
        report-path: outputs/mc_dropout_smoke_gpu/reports
        split: test
        baselines: zero,climatology
        ensemble-size: 5                    # NEVER 1: spread_skill_sums uses ddof=1, so M=1 yields a silent NaN
        accelerator: gpu
        devices: 1
        num-workers: 8
        batch-size: 4
        progress-bar: true

tags:                                                                               # tags to be applied to the run
    version: 1.0
    experiment: mc_dropout_smoke_gpu
