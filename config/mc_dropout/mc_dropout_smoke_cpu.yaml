project_uri: 'src/stages'                                                           # the path of the directory where each stage script is saved
log_artifacts: false                                                                # whether to log the output file/directory as artifact
log_models: false                                                                   # whether to log the output model
lazy: false                                                                         # NEVER cache a smoke run: the point is to execute every stage
ensure_determinism: false
banner: true
description: 'MC-dropout -- CPU smoke tier'

# =====================================================================================================================
# CPU SMOKE TIER of config/mc_dropout/mc_dropout.yaml. Read that file for what the pipeline does and why, and
# config/deterministic_unet/deterministic_unet_smoke_cpu.yaml for the full list of smoke overrides and their rationale.
#
# The one thing this tier must exercise that the deterministic tier cannot: the TWO-PHASE fit and the ensemble path.
# `finetuning.max_epochs` in the search space stays as-is (10) -- it is the phase-2 ceiling, and with 4 train days an
# epoch is a handful of steps, so it costs little and actually exercises the phase-2 code.
#
# WARM-START MODE in the smoke tier: leave UPSTREAM_MODEL unset to smoke the from-scratch two-phase fit. To smoke the
# warm-start path instead, run config/deterministic_unet/deterministic_unet_smoke_cpu.yaml first and point
# UPSTREAM_MODEL at ITS checkpoint -- NOT at a real one, whose feature normalization was fitted on different days:
#
#     export UPSTREAM_MODEL=outputs/deterministic_unet_smoke_cpu/best/best_model.ckpt
#
# Environment: export DATA_ROOT before running; UPSTREAM_MODEL only for the warm-start smoke variant.
# =====================================================================================================================

stages:
    - setup:
        outputs: outputs
        prepared: outputs/mc_dropout_smoke_cpu/prepared
        tuning: outputs/mc_dropout_smoke_cpu/tuning
        best: outputs/mc_dropout_smoke_cpu/best
        evaluation: outputs/mc_dropout_smoke_cpu/evaluation
        reports: outputs/mc_dropout_smoke_cpu/reports

    - prepare_modeling:
        data-path: '{{$DATA_ROOT}}'
        split-config: config/split/split_smoke_cpu.yaml
        output-path: outputs/mc_dropout_smoke_cpu/prepared/daily
        mode: daily
        feature-aggregation: hourly_stack
        features: MU_LI,MU_MIXR,RH_500850,cp,lsm
        hourly-threshold: 2
        overwrite: false
        materialize-features: true
        feature-dtype: float32

    - tune:
        model-family: mc_dropout
        model-type: mc_dropout
        input-path: outputs/mc_dropout_smoke_cpu/prepared/daily
        model-config: config/mc_dropout/search_space.yaml
        metrics-config: config/eval/metrics.yaml
        output-path: outputs/mc_dropout_smoke_cpu/tuning
        metrics-path: outputs/mc_dropout_smoke_cpu/tuning/best_trial_metrics.json
        upstream-model-path: '{{$UPSTREAM_MODEL}}'  # unset/empty -> from-scratch two-phase smoke fit
        n-trials: 1
        sampler: random
        max-epochs: 1                       # phase 1 only (ignored in warm-start mode); phase 2 always uses
                                            # search_space.yaml -> finetuning.max_epochs
        early-stopping-patience: 1
        pruning: false
        accelerator: cpu
        devices: 1
        num-workers: 0
        progress-bar: true
        feature-stats-days: 4               # cannot exceed the 4 train days of the smoke split

    - retrain_best:
        model-family: mc_dropout
        model-type: mc_dropout
        source-path: outputs/mc_dropout_smoke_cpu/tuning
        input-path: outputs/mc_dropout_smoke_cpu/prepared/daily
        metrics-config: config/eval/metrics.yaml
        output-path: outputs/mc_dropout_smoke_cpu/best
        metrics-path: outputs/mc_dropout_smoke_cpu/best/best_trial_metrics.json
        max-epochs: 1
        early-stopping-patience: 1
        accelerator: cpu
        devices: 1
        num-workers: 0
        progress-bar: true

    - evaluate:
        input-path: outputs/mc_dropout_smoke_cpu/prepared/daily
        model-path: outputs/mc_dropout_smoke_cpu/best/best_model.ckpt
        output-path: outputs/mc_dropout_smoke_cpu/evaluation
        metrics-config: config/eval/metrics.yaml
        metrics-path: outputs/mc_dropout_smoke_cpu/evaluation/test_metrics.json
        report-path: outputs/mc_dropout_smoke_cpu/reports
        split: test
        baselines: zero,climatology
        ensemble-size: 2                    # NEVER 1: spread_skill_sums uses ddof=1, so M=1 yields a silent NaN.
                                            # 2 is the minimum that still populates the ensemble metric group.
        accelerator: cpu
        devices: 1
        num-workers: 0
        batch-size: 2
        progress-bar: true

tags:                                                                               # tags to be applied to the run
    version: 1.0
    experiment: mc_dropout_smoke_cpu
