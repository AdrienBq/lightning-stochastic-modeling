project_uri: 'src/stages'                                                           # the path of the directory where each stage script is saved
log_artifacts: false                                                                # whether to log the output file/directory as artifact
log_models: false                                                                   # whether to log the output model
lazy: true                                                                          # skip a stage whose code state + parameters + input checksums match a
                                                                                    # previously recorded successful run whose outputs are still present and
                                                                                    # byte-identical on disk. Safe and worthwhile here because prepare is
                                                                                    # expensive. Overridable per stage with a `lazy:` key.
                                                                                    # NOTE: the cache keys on the whole-repo dirty diff, so COMMIT before
                                                                                    # running -- any uncommitted edit busts every entry.
ensure_determinism: false                                                           # when a stage is executed with unchanged code+inputs+params but produces a
                                                                                    # different output, that non-determinism is warned about; set true to raise.
                                                                                    # Overridable per stage (`ensure-determinism:`).
banner: true                                                                        # set false to disable the start-up welcome banner entirely
description: 'Deterministic U-net: the baseline, and the upstream model for residual diffusion'

# =====================================================================================================================
# Pipeline: DETERMINISTIC U-NET parameterization of lightning from ERA5 reanalysis predictors.
#
# Given a day's gridded ERA5 predictors (MU_LI, MU_MIXR, RH_500850, cp, lsm), predict that day's gridded lightning
# field. This is a diagnostic ERA5 -> lightning mapping, NOT a temporal forecast: there is no t+dt objective.
#
# This family plays two roles:
#   1. the deterministic BASELINE every stochastic family must beat, and
#   2. the UPSTREAM model for the residual (knowledge-guided) diffusion pipeline -- point
#      config/diffusion/diffusion.yaml's `upstream-model-path` at the best_model.ckpt this pipeline writes.
#
# Stages (all shared; none is family-specific):
#   setup              -> create the output tree
#   prepare_regression -> tensorize predictors + the daily 0-24 lightning-hours target for the shared year split
#   tune               -> the unified tuning harness, dispatched by `model-family`
#   retrain_best       -> refit the winning trial's configuration
#   evaluate_regression-> THE common evaluation, identical for all three families
#
# Target: `mode: daily` -- the number of hours in the day with lightning, per cell, BOUNDED 0-24 (informally
# "daily lightning hours"; the mode is the only thing that selects it, there is no target-variable key). It is a
# bounded regression, so ordinary distance losses and error metrics apply; unbounded-count machinery (Tweedie,
# Poisson) does not and is absent from the search space.
#
# Environment: export DATA_ROOT before running (the dataset root holding metadata.json, metadata.csv, samples/).
# =====================================================================================================================

stages:
    - setup:
        outputs: outputs
        prepared: outputs/deterministic_unet/prepared
        tuning: outputs/deterministic_unet/tuning
        best: outputs/deterministic_unet/best
        evaluation: outputs/deterministic_unet/evaluation
        reports: outputs/deterministic_unet/reports

    # ------------------------------------------------------------------------------------------------------------
    # 1) Data preparation
    # Reads the batta_torch .pt samples (the 5 ERA5 predictors + gridded ATDnet lightning) and writes the per-day
    # targets, the split index and the train target statistics. No feature scaler is produced: feature
    # standardization is fitted by the tuning stage and baked into the checkpoint (the dataset-side scalers/
    # directory is deprecated).
    # ------------------------------------------------------------------------------------------------------------
    - prepare_regression:
        data-path: '{{$DATA_ROOT}}'         # dataset root; NEVER hardcode a path. The token is {{$VAR}} -- an
                                            # unset variable substitutes to the empty string, so a missing
                                            # DATA_ROOT fails at the stage, not silently.
        split-config: config/split/split.yaml     # the shared year-based split (see CLAUDE.md "Data")
        output-path: outputs/deterministic_unet/prepared/daily
        mode: daily                         # daily | hourly (aggregation level of the items only)
        feature-aggregation: hourly_stack   # hourly_stack | daily_mean (daily mode only); stacks 24 hourly maps
                                            # into C*24 input channels
        features: MU_LI,MU_MIXR,RH_500850,cp,lsm
        hourly-threshold: 2                 # an hour counts as a lightning-hour only with >= 2 strokes: the
                                            # single-stroke observational-noise filter. The value IS the minimum
                                            # stroke count (1 = every hour with any stroke). Applied to the hourly
                                            # counts BEFORE aggregation, so it is baked into the target --
                                            # changing it means re-preparing AND re-training.
        overwrite: false
        materialize-features: true          # memory-mappable per-day features/<date>.npy: the loader's fast path
        feature-dtype: float16              # halves the features/ footprint and the per-item read+copy, the
                                            # dominant cost of the hourly-stack loader. Feature statistics
                                            # accumulate in float64, so storage precision does not affect
                                            # normalization.

    # ------------------------------------------------------------------------------------------------------------
    # 2) Hyperparameter tuning -- the UNIFIED stage, dispatched by `model-family` (there are no per-family tune_*
    # stages). Architecture / loss / occurrence-head / calibration search space lives in model-config, which the
    # orchestrator logs as a run artifact. Trials are ranked on the shared composite score defined in that file's
    # `selection` block, so all three families' trials tables are directly comparable.
    # ------------------------------------------------------------------------------------------------------------
    - tune:
        model-family: deterministic_unet
        model-type: deterministic_unet      # tagged on the mlflow run for ease of access
        input-path: outputs/deterministic_unet/prepared/daily
        model-config: config/deterministic_unet/search_space.yaml
        metrics-config: config/eval/metrics.yaml # supplies the climatology baseline behind the
                                            # mae_cond_ss_climatology selection component
        output-path: outputs/deterministic_unet/tuning
        metrics-path: outputs/deterministic_unet/tuning/best_trial_metrics.json
        n-trials: 40
        sampler: tpe                        # random | tpe (tpe requires optuna)
        max-epochs: 50
        early-stopping-patience: 10
        pruning: true                       # optuna MedianPruner aborts hopeless trials early (needs sampler: tpe)
        accelerator: auto
        devices: 1
        num-workers: 8
        progress-bar: true                  # set false for batch jobs with redirected logs
        feature-stats-days: 256             # train days streamed to fit the feature normalization baked into
                                            # every checkpoint

    # ------------------------------------------------------------------------------------------------------------
    # 3) Retrain the winning configuration. Reads the sweep's best_trial.json, refits the feature normalization and
    # trains one model with that exact configuration -- the checkpoint from which is derived the evaluation of the
    # deterministic model and from which the residuals are computed for the diffusion pipeline.
    # The selection metric/mode are read back from source-path/best_trial.json, so they cannot disagree with the
    # sweep that chose the configuration; there is no stage parameter to keep in sync.
    # ------------------------------------------------------------------------------------------------------------
    - retrain_best:
        model-family: deterministic_unet
        model-type: deterministic_unet
        source-path: outputs/deterministic_unet/tuning
        input-path: outputs/deterministic_unet/prepared/daily
        metrics-config: config/eval/metrics.yaml
        output-path: outputs/deterministic_unet/best
        metrics-path: outputs/deterministic_unet/best/best_trial_metrics.json
        max-epochs: 80
        early-stopping-patience: 10
        accelerator: auto
        devices: 1
        num-workers: 8
        progress-bar: true

    # ------------------------------------------------------------------------------------------------------------
    # 4) Evaluation and reporting -- THE common evaluation. registry.load_regression_module dispatches the family
    # from the checkpoint marker, and the SAME metric suite runs for every family, so tabulate_metrics can put them
    # in one table with identical metric-key columns. Writes a flat JSON of scalars (auto-logged to mlflow via
    # metrics-path) and a report directory of figures + CSVs (auto-logged via report-path).
    # ------------------------------------------------------------------------------------------------------------
    - evaluate_regression:
        input-path: outputs/deterministic_unet/prepared/daily
        model-path: outputs/deterministic_unet/best/best_model.ckpt
        output-path: outputs/deterministic_unet/evaluation
        metrics-config: config/eval/metrics.yaml
        metrics-path: outputs/deterministic_unet/evaluation/test_metrics.json
        report-path: outputs/deterministic_unet/reports
        split: test                         # valid | test
        baselines: zero,climatology         # no persistence: a diagnostic parameterization has no past observation
        ensemble-size: 2                    # this family is deterministic, so predict_step emits no
                                            # ensemble_members and the ensemble scores are skipped. Still never
                                            # set 1: spread_skill_sums uses ddof=1, so M=1 yields a silent NaN.
        accelerator: auto
        devices: 1
        num-workers: 8
        batch-size: 16
        progress-bar: true

tags:                                                                               # tags to be applied to the run
    version: 1.0
    experiment: deterministic_unet
