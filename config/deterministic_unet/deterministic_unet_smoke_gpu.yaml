project_uri: 'src/stages'                                                           # the path of the directory where each stage script is saved
log_artifacts: false                                                                # whether to log the output file/directory as artifact
log_models: false                                                                   # whether to log the output model
lazy: false                                                                         # NEVER cache a smoke run: the point is to execute every stage
ensure_determinism: false
banner: true
description: 'Deterministic U-net -- GPU smoke tier'

# =====================================================================================================================
# GPU SMOKE TIER of config/deterministic_unet/deterministic_unet.yaml. Read that file for what the pipeline does and why.
#
# Same purpose as config/deterministic_unet/deterministic_unet_smoke_cpu.yaml -- prove every stage executes and every artifact and metric
# key appears -- but sized for a GPU host, so it additionally exercises the paths a CPU run never touches:
# accelerator gpu, mixed precision, and multi-worker data loading. This host has no GPU; the tier exists because the
# repo must be machine-agnostic (see .claude/plans/step-5-portability.md).
#
# Differences from the CPU tier:
#   split-config -> config/split/split_smoke_gpu.yaml (18 mid-July days: 10 train / 4 valid / 4 test)
#   n-trials 2   -> two trials, so the sampler and the trial-comparison path are exercised, not just one fit
#   sampler tpe  -> at two trials TPE still falls back to random for the first, but the optuna TPE code path runs
#   accelerator gpu / num-workers 8 / precision bf16-mixed / feature-dtype float16
#   ensemble-size 5 -> a wider ensemble than the CPU tier's bare minimum of 2
#
# Environment: export DATA_ROOT before running.
# =====================================================================================================================

stages:
    - setup:
        outputs: outputs
        prepared: outputs/deterministic_unet_smoke_gpu/prepared
        tuning: outputs/deterministic_unet_smoke_gpu/tuning
        best: outputs/deterministic_unet_smoke_gpu/best
        evaluation: outputs/deterministic_unet_smoke_gpu/evaluation
        reports: outputs/deterministic_unet_smoke_gpu/reports

    - prepare_regression:
        data-path: '{{$DATA_ROOT}}'
        split-config: config/split/split_smoke_gpu.yaml
        output-path: outputs/deterministic_unet_smoke_gpu/prepared/daily
        mode: daily
        feature-aggregation: hourly_stack
        features: MU_LI,MU_MIXR,RH_500850,cp,lsm
        hourly-threshold: 2
        overwrite: false
        materialize-features: true
        feature-dtype: float16

    - tune:
        model-family: deterministic_unet
        model-type: deterministic_unet
        input-path: outputs/deterministic_unet_smoke_gpu/prepared/daily
        model-config: config/deterministic_unet/search_space.yaml
        metrics-config: config/eval/metrics.yaml
        output-path: outputs/deterministic_unet_smoke_gpu/tuning
        metrics-path: outputs/deterministic_unet_smoke_gpu/tuning/best_trial_metrics.json
        n-trials: 2
        sampler: tpe
        max-epochs: 1
        early-stopping-patience: 1
        pruning: false                      # a 1-epoch trial has nothing to prune
        accelerator: gpu
        devices: 1
        num-workers: 8
        precision: bf16-mixed               # selection metrics stay fp32 on CPU
        progress-bar: true
        feature-stats-days: 10              # cannot exceed the 10 train days of the smoke split

    - retrain_best:
        model-family: deterministic_unet
        model-type: deterministic_unet
        source-path: outputs/deterministic_unet_smoke_gpu/tuning
        input-path: outputs/deterministic_unet_smoke_gpu/prepared/daily
        metrics-config: config/eval/metrics.yaml
        output-path: outputs/deterministic_unet_smoke_gpu/best
        metrics-path: outputs/deterministic_unet_smoke_gpu/best/best_trial_metrics.json
        max-epochs: 1
        early-stopping-patience: 1
        accelerator: gpu
        devices: 1
        num-workers: 8
        precision: bf16-mixed
        progress-bar: true

    - evaluate_regression:
        input-path: outputs/deterministic_unet_smoke_gpu/prepared/daily
        model-path: outputs/deterministic_unet_smoke_gpu/best/best_model.ckpt
        output-path: outputs/deterministic_unet_smoke_gpu/evaluation
        metrics-config: config/eval/metrics.yaml
        metrics-path: outputs/deterministic_unet_smoke_gpu/evaluation/test_metrics.json
        report-path: outputs/deterministic_unet_smoke_gpu/reports
        split: test
        baselines: zero,climatology
        ensemble-size: 5                    # NEVER 1: spread_skill_sums uses ddof=1, so M=1 yields a silent NaN
        accelerator: gpu
        devices: 1
        num-workers: 8
        batch-size: 4
        progress-bar: true

tags:                                                                               # tags to be applied to the run
    version: 1.0
    experiment: deterministic_unet_smoke_gpu
