# =====================================================================================================================
# Search space + training options for the `tune` stage with `model-family: deterministic_unet` (referenced as
# model-config in config/deterministic_unet/deterministic_unet.yaml, and logged as a run artifact by the orchestrator).
#
# This family is the deterministic U-net: the baseline, AND the upstream model whose prediction the residual
# diffusion corrects. It carries the SHARED SKELETON only — no ensemble knobs (it is deterministic, so
# evaluate_regression emits no ensemble_members) and no flow-matching knobs.
#
# Conventions:
#   * categorical hyperparameters:  {type: categorical, choices: [...]}
#   * integer ranges:               {type: int, low: ..., high: ...}
#   * float ranges:                 {type: float, low: ..., high: ..., log: true|false}
#   * plain values (not tuned):     given directly
# Conditional parameters (e.g. everything under `occurrence_head` when occurrence_head.enabled samples false) are
# simply ignored by the trial when their parent switch is off.
#
# There is deliberately NO `target_transform:` block. The gamma F-transform is gone: training space == target space
# (see config/eval/metrics.yaml). Do not reintroduce it.
# =====================================================================================================================

# ---------------------------------------------------------------------------------------------------------------------
# Regression loss on the bounded 0-24 daily lightning-hours target. Every option is designed against the extreme
# imbalance, pulling gradients towards active cells and preferring conservative (over-predicting) errors over misses.
#
# Note what is ABSENT: `tweedie` and `poisson_nll`. Both are unbounded count likelihoods — Poisson in particular puts
# probability mass above 24 hours/day, which is not merely imprecise but wrong for this target.
#
# Note also that plain `mae` / `rmse` are absent BY CONSTRUCTION, not by omission: intensity weighting is
# w(y) = (1 + y)^gamma, so gamma = 0 makes weighted_mae identically mae and weighted_rmse identically rmse. This is
# why intensity_weight_gamma's lower bound MUST stay at 0.0 — raising it makes the unweighted losses unreachable.
# ---------------------------------------------------------------------------------------------------------------------
loss:
    name: {type: categorical, choices: [weighted_mae, weighted_rmse, weighted_mse, asymmetric_huber, wmae_psd, wmse_psd]}

    # intensity weighting w(y) = (1 + y)^gamma, computed from the RAW target and applied samplewise.
    # 0.0 = unweighted (recovers mae / rmse / mse); higher gamma increasingly up-weights high-hour cells.
    intensity_weight_gamma: {type: float, low: 0.0, high: 5.0}

    # asymmetric_huber only: under-prediction is penalized tau/(1-tau) times more than over-prediction, so
    # tau > 0.5 encodes the preference for conservative models
    asymmetry_tau: {type: float, low: 0.5, high: 0.9}
    huber_delta:   {type: float, low: 0.5, high: 3.0}

    # wmae_psd / wmse_psd only: composite = alpha * <pointwise term> + (1 - alpha) * psd_penalty, where
    # psd_penalty (in [0, 1]) radially bins the predicted and observed power spectra, forms a per-bin power ratio ->
    # fidelity clip(1 - |1 - ratio|, 0, 1) and penalizes 1 - mean fidelity, directly discouraging over-smoothing at
    # every spatial scale. Kept >= 0.5 so the pointwise (magnitude-aware) term stays dominant: the PSD penalty is a
    # scale-invariant power ratio carrying no signal about prediction magnitude, so a PSD-dominated loss would admit
    # degenerate count-blind solutions.
    alpha: {type: float, low: 0.5, high: 1.0}

# ---------------------------------------------------------------------------------------------------------------------
# ⛔ THERE IS NO `occurrence_head:` BLOCK, BY DECISION. The model has exactly ONE output head, and `mode` decides
# what it emits: 0-24 lightning-hours (daily) or an occurrence probability (hourly). Two things were considered and
# rejected:
#   * a GATE (a classifier masking dry cells, the regressor fitted on wet cells only, prediction = regression x
#     mask). It answers an UNBOUNDED count target; this target is bounded 0-24, where the regression covers the
#     zeros directly.
#   * a REPORT-ONLY second head, emitting P(lightning) purely to feed the probability metrics without touching the
#     prediction. Dropped as machinery that changes no forecast.
#
# ⚠️ CONSEQUENCE, in daily runs: `brier_skill_score`, `explained_deviance`, `dice_occurrence` and the reliability
# ⚠️ diagram need a calibrated probability and are therefore NaN / absent. `average_precision_occurrence` and
# ⚠️ `roc_auc` are NOT lost — they rank on the predicted hours, and AP/AUC are invariant to any monotone rescaling,
# ⚠️ so that is exact rather than an approximation. That keeps the one reported component which sees a false alarm
# ⚠️ (see the KNOWN GAP note under `selection:` below).
#
# The binary losses in losses.py are not orphaned by this: they are the MAIN loss of the hourly task, built from the
# same `loss:` section above. An hourly search space just sets `loss.name` to one of focal_bce / dice / brier /
# crps_binary (plus focal_gamma and positive_class_weight for focal_bce) and changes nothing else.
#
# ⚠️ The LOSS NAME picks the builder, NOT the mode — because the hourly task admits BOTH families. A distance loss
# ⚠️ on the predicted probability is not a misuse but proper: rmse(p, y)^2 is exactly brier_score(p, y). So an hourly
# ⚠️ pipeline may keep `loss.name: weighted_mse` and module.py hands the loss the PROBABILITY; with a binary name it
# ⚠️ hands over the LOGIT, which every binary loss sigmoids internally. Either way the sigmoid exists in exactly one
# ⚠️ place. The reverse is rejected: a binary loss on the 0-24 daily target raises.
#
# ⚠️ This is also why `loss.intensity_weight_gamma` keeps a role in hourly mode and its apply_constraints rule is
# ⚠️ narrow. No distance loss carries a positive-class weight of its own, and on a binary target
# ⚠️ (1 + y)^gamma ∈ {1, 2^gamma} IS one — so gamma is the reweighting knob there. Only `focal_bce`, which brings its
# ⚠️ own positive_class_weight, has gamma forced to 0.
#
# ⚠️ `crps_binary` must never be given to THIS family: it needs a genuine ensemble, and a deterministic single
# ⚠️ forward pass gives N = 1, a spread term identically zero, and a silent degradation to a mean absolute error on
# ⚠️ probabilities. module.py raises rather than letting that train.
# ---------------------------------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------------------------------
# U-net backbone.
#
# `normalization` is a FIXED value, not a searched choice, for two reasons:
#   1. EVERY checkpoint of this family must be a valid UPSTREAM -- for MC-dropout's warm start (which loads these
#      weights directly) and for diffusion's residual conditioning. MC inference re-enables dropout while the rest
#      of the model runs in eval(); batch norm keeps running mean/var statistics that would unfreeze and shift under
#      that, so a batch-norm upstream is unusable. Leaving the choice open would let a 40-trial sweep hand back a
#      best model that no downstream family can consume.
#   2. Batch sizes here are 4-32, where batch-norm statistics are noisy anyway.
# ---------------------------------------------------------------------------------------------------------------------
# The four FIXED values below are required by UNetBackbone and deliberately not searched — each would widen the
# space for little return at this resolution:
#   * kernel_size 3      : 5 roughly triples the parameter count per block; at 0.25 deg (~28 km) the extra receptive
#                          field is cheaper to buy with `depth`, which IS searched.
#   * blocks_per_level 2 : the standard U-net double-conv block.
#   * upsampling         : bilinear_conv, NOT transposed_conv. Transposed convolutions produce checkerboard
#                          artefacts, and this project SELECTS on spatial structure (`psd_full_fidelity` carries
#                          0.40 of the composite), so a periodic upsampling artefact would be scored as texture.
#   * dropout 0.0        : this family is deterministic. mc_dropout needs dropout > 0 and carries its own top-level
#                          `dropout_p`, which its module injects here.
unet:
    base_channels: {type: categorical, choices: [16, 32, 64]}
    depth: {type: int, low: 3, high: 5}                 # number of down/upsampling levels
    kernel_size: 3                                      # FIXED -- see above
    blocks_per_level: 2                                 # FIXED -- see above
    upsampling: bilinear_conv                           # FIXED -- transposed_conv/bilinear_conv; see above
    dropout: 0.0                                        # FIXED -- deterministic family
    normalization: group                                # FIXED -- see the two reasons above
    activation: {type: categorical, choices: [relu, gelu, silu]}
    bottleneck_attention: {type: categorical, choices: [true, false]}

# Output head. `softplus` guarantees a non-negative prediction, which IS the target's lower bound (0 hours), so no
# separate `min_hours` knob is needed -- the floor is structural. It is left as a single-choice categorical rather
# than a plain scalar so the search space keeps one shape across families and adding an alternative later needs no
# restructuring.
#
# ⚠️ softplus is UNBOUNDED ABOVE, so `max_hours` is NOT enforced by the activation. Step 3 must decide where the
#    ceiling is applied -- see step-3-utils.md ("open question: where max_hours is enforced").
output_activation: {type: categorical, choices: [softplus]}
max_hours: 24                                           # the bounded-target ceiling, in hours per day

# ---------------------------------------------------------------------------------------------------------------------
# Calibration of the model head, fitted in a dedicated FINAL phase with the backbone frozen. Treated as a
# hyperparameter (on/off), identity-initialised so that "disabled" is an exact no-op.
#
# ⚠️ EXACTLY ONE of the two applies to any given run, and WHICH is decided by `mode`, not configured — Platt scaling
# ⚠️ recalibrates a logit and the monotone warp recalibrates non-negative hours, so neither is meaningful in the
# ⚠️ other task. `training_phases()` therefore returns at most one calibration phase. In a DAILY pipeline like this
# ⚠️ one, `occurrence:` below is inert: module.py logs once and ignores it.
#   * occurrence (HOURLY ONLY): classical Platt scaling of the head's logit, p = sigmoid(a * z + b), fitted with
#     PLAIN BCE on the occurrence labels — independent of which binary loss trained the head. Rank-preserving, so it
#     recalibrates the probabilities (Brier / reliability / explained deviance) without moving a decision mask.
#   * regression (DAILY ONLY): a MONOTONE, zero-preserving recalibration of the predicted hours, fitted with a plain symmetric
#     log1p-Huber loss on observed-positive cells. Deliberately decoupled from the backbone's weighted loss
#     (otherwise the calibrator just relearns the identity), and both extremes-robust (Huber) and scale-robust
#     (log1p). `structure` is itself a hyperparameter:
#       - power_law       : g(p) = s * ((1 + p)^a - 1), s, a > 0           (2 parameters, rigid, robust)
#       - monotone_smooth : g(p) = expm1(m(log1p(p))), m monotone, m(0)=0  (base slope + num_sigmoids bumps)
#     `objective` fits the SAME map either per-cell (`pointwise`, corrects the conditional mean) or on the SORTED
#     marginals (`quantile`, classical quantile-mapping bias correction).
#     log1p space is valid here BECAUSE the target is non-negative and there is no signed transformed space any
#     more — the earlier count-regression objection to this block no longer applies.
# ---------------------------------------------------------------------------------------------------------------------
calibration:
    occurrence: {type: categorical, choices: [none, platt]}     # hourly only; inert in this daily pipeline
    regression:
        structure: {type: categorical, choices: [none, power_law, monotone_smooth]}
        objective: {type: categorical, choices: [pointwise, quantile]}
        num_sigmoids: 4                                 # bumps of the monotone_smooth structure (unused otherwise)
        huber_delta: 1.0                                # Huber transition in log1p space (~factor e at delta=1)

# ---------------------------------------------------------------------------------------------------------------------
# Optimization
# ---------------------------------------------------------------------------------------------------------------------
optimizer:
    name: adamw
    lr: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
    weight_decay: {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
    scheduler: {type: categorical, choices: [cosine, reduce_on_plateau]}
    gradient_clip_val: 1.0

batch_size: {type: int, low: 4, high: 32}
max_epochs: 50

# ---------------------------------------------------------------------------------------------------------------------
# Trial selection: ONE composite per TASK, shared by all three families so their trials tables are directly
# comparable. Computed on the validation split, in the target space, on the ensemble MEAN for stochastic families.
# Component definitions are exactly the metric keys emitted by config/eval/metrics.yaml.
#
#   valid_regression_score = 0.60 * mae_cond_ss_climatology       (magnitude: conditional-MAE skill vs the
#                                                                  climatology baseline on occurrence cells;
#                                                                  anti-trivial — an all-zero model scores <= 0)
#                          + 0.40 * psd_full_fidelity             (structure: 1 - |1 - full-band PSD ratio|,
#                                                                  clipped to [0, 1]; anti-smoothing)
#
# ⚠️ `metric:` is a DECLARATION, not a choice. The composite is determined by the prepared data's `mode` — daily
# ⚠️ gives valid_regression_score, hourly gives valid_classification_score — and
# ⚠️ validation.selection_metric_for_mode RAISES when this line disagrees, rather than overriding it, because a
# ⚠️ file naming the wrong composite has the wrong `components` weights too. An hourly pipeline must change BOTH.
#
# ⚠️ KNOWN GAP: neither term sees a FALSE ALARM. mae_cond_ss_climatology is conditioned on observed-positive cells
# ⚠️ only, and psd_full_fidelity is a location-insensitive power ratio, so a spatially-textured over-forecast is
# ⚠️ not penalized by this composite. `average_precision_occurrence` — the one component that does see false
# ⚠️ alarms — is computed and REPORTED in the trials table but carries weight 0 by decision; read it when two
# ⚠️ trials have similar composites.
# ---------------------------------------------------------------------------------------------------------------------
selection:
    metric: valid_regression_score
    mode: max
    components:
        mae_cond_ss_climatology:      0.60
        psd_full_fidelity:            0.40
