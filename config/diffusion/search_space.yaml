# =====================================================================================================================
# Search space + training options for the `tune` stage with `model-family: diffusion` (referenced as model-config in
# config/diffusion/diffusion.yaml, and logged as a run artifact by the orchestrator).
#
# The model is a conditional FLOW-MATCHING velocity field: a conv stem fuses the conditioning channels (standardized
# ERA5 predictors, plus the upstream-prediction channel in residual mode) with the noisy-target channel and patch-
# embeds them onto a token grid; DiT-style blocks (adaLN-Zero time conditioning) process the tokens; a conv decoder
# emits the velocity map. The path is the straight (rectified-flow) interpolant and the loss is the plain velocity
# MSE, so `loss:` below governs the TARGET-SPACE selection/auxiliary terms, not the flow objective itself.
#
# Same shared skeleton as config/deterministic_unet/search_space.yaml (read that file for the loss / occurrence-head /
# calibration / selection rationale), plus the residual switch and the flow block.
#
# There is deliberately NO `target_transform:` block, and — unlike the source branch — no `flow.log_warp` knob: it
# selected between a log1p-standardized and a raw generation space, i.e. it WAS the target transform under another
# name. It is removed with the rest of it, so generation happens in one fixed space and valid_regression_score is
# comparable across every trial.
# =====================================================================================================================

# ---------------------------------------------------------------------------------------------------------------------
# RESIDUAL (knowledge-guided) mode. When on, the model does not learn the target: it learns the DISCREPANCY between
# the observation and an upstream deterministic_unet prediction, and returns clamp(upstream + residual, 0, max_hours).
#
# ⛔ THERE IS NO `residual_target:` KEY, and there must not be. It is a property of the PREPARED DIRECTORY, not a
# ⛔ hyperparameter: the mode exists only if prepare_modeling was given `upstream-model-path`, which is what
# ⛔ materialises upstream/<date>.npy, appends the upstream prediction as the LAST conditioning channel and makes the
# ⛔ dataset yield a third batch item (x_cond, y, upstream). Sampling it per trial would make roughly half of every
# ⛔ sweep's trials ask for a mode the data cannot provide, and they would fail on the channel count rather than
# ⛔ train. diffusion_module.py reads it from target_stats instead, like dataset.py already does.
#
# So ONE PIPELINE RUN IS ONE MODE, chosen by the environment:
#     UPSTREAM_MODEL set   -> residual        UPSTREAM_MODEL unset -> full target
# Switching changes the input channel count, so switch output directories (or set overwrite: true on prepare)
# rather than reusing a directory prepared for the other setting.
# ---------------------------------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------------------------------
# Flow-matching backbone + ODE sampling.
# Constraints satisfied by construction below: hidden_dim is divisible by num_heads and by 4 (the 2-D positional
# embedding), and patch_size is a power of two.
# ---------------------------------------------------------------------------------------------------------------------
flow:
    n_steps: {type: int, low: 8, high: 32}              # Euler ODE integration steps during validation scoring;
                                                        # evaluate overrides with `sampling-steps`
    hidden_dim: {type: categorical, choices: [128, 256]} # token (model) width
    n_blocks: {type: int, low: 2, high: 6}              # DiTBlock count. Named n_blocks rather than `depth`
                                                        # because `depth` already means the down/upsampling level
                                                        # count in the other families' `unet` block; the module
                                                        # translates it (see DiffusionModule._net_config).
    num_heads: 4                                        # FIXED, and REQUIRED by FlowVelocityNet: both hidden_dim
                                                        # choices divide by 4, giving 32- or 64-wide heads.
    patch_size: {type: categorical, choices: [1, 2]}    # stem stride / token-grid coarsening (power of two).
                                                        # 1 = full resolution: the 101 x 149 grid is small enough
                                                        # that this is affordable, and coarse patches are exactly
                                                        # what destroys the high-frequency fidelity the PSD scores
                                                        # measure.

# ---------------------------------------------------------------------------------------------------------------------
# ⛔ THIS BLOCK IS NOT THE TRAINING OBJECTIVE OF THIS FAMILY, and diffusion_module.py does not read it.
#
# The flow trains on the velocity MSE alone: one forward pass predicts v(x_t, t, cond) against the straight-path
# target x1 - z. That objective lives in the generation space and never forms a lightning-hours map. Applying any
# term below would first require a PREDICTION, and this family only produces one by integrating the ODE —
# `flow.n_steps` (8-32) forward passes per training step, with the gradient threaded through the whole Euler chain,
# i.e. roughly an order of magnitude slower per trial.
#
# The block is kept for skeleton parity with the other two families (same file shape, same keys, same names), and
# because the target-space composite under `selection:` IS what trials are ranked on — but that is computed from ODE
# draws on the validation split, not from this section. Do not add a `loss.name` here expecting it to train.
# ---------------------------------------------------------------------------------------------------------------------
loss:
    name: {type: categorical, choices: [weighted_mae, weighted_rmse, weighted_mse, asymmetric_huber, wmae_psd, wmse_psd]}
    intensity_weight_gamma: {type: float, low: 0.0, high: 5.0}   # 0.0 => unweighted
    asymmetry_tau: {type: float, low: 0.5, high: 0.9}            # asymmetric_huber only
    huber_delta:   {type: float, low: 0.5, high: 3.0}
    alpha:         {type: float, low: 0.5, high: 1.0}            # wmae_psd / wmse_psd: pointwise weight;
                                                                 # (1 - alpha) -> psd_penalty

# ---------------------------------------------------------------------------------------------------------------------
# ⛔ NO `occurrence_head:` BLOCK — identical decision and identical rationale to the deterministic family; read that
# file. One output head, `mode` decides what it emits, and the binary losses become the MAIN loss of the hourly task
# — selected by `loss.name`, since hourly accepts distance losses too.
# Like mc_dropout and unlike the deterministic family, this one CAN train `crps_binary` in an hourly pipeline: each
# ODE draw is a member, so the spread term is real.
# ---------------------------------------------------------------------------------------------------------------------

# Output head -- see config/deterministic_unet/search_space.yaml. softplus gives the 0-hour floor structurally;
# ⚠️ it is unbounded above, so `max_hours` is not enforced by the activation (Step 3 decides where). In residual
# mode `max_hours` is ALSO the ceiling of the reconstruction clamp: clamp(upstream + residual, 0, max_hours).
output_activation: {type: categorical, choices: [softplus]}
max_hours: 24                                           # the bounded-target ceiling, in hours per day

# ⚠️ At most ONE calibration phase runs, and `mode` picks it: `occurrence` (Platt, on a logit) is HOURLY ONLY and
# ⚠️ inert in this daily pipeline; `regression` (the monotone hour warp) is DAILY ONLY. See the deterministic family.
calibration:
    occurrence: {type: categorical, choices: [none, platt]}     # hourly only; inert in this daily pipeline
    regression:
        structure: {type: categorical, choices: [none, power_law, monotone_smooth]}
        objective: {type: categorical, choices: [pointwise, quantile]}
        num_sigmoids: 4
        huber_delta: 1.0

# ---------------------------------------------------------------------------------------------------------------------
# Optimization
# ---------------------------------------------------------------------------------------------------------------------
optimizer:
    name: adamw
    lr: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
    weight_decay: {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
    scheduler: {type: categorical, choices: [cosine, reduce_on_plateau]}
    gradient_clip_val: 1.0

batch_size: {type: int, low: 4, high: 32}
max_epochs: 50

# ---------------------------------------------------------------------------------------------------------------------
# Trial selection — the SAME composite and the SAME name as every other family (see
# config/deterministic_unet/search_space.yaml for the full derivation). Ranking on this target-space composite rather
# than on the validation flow-matching loss is deliberate: the flow loss lives in the generation space and says
# nothing about occurrence skill or structure fidelity. The pointwise and categorical components score the ensemble
# MEAN of the validation draws; psd_full_fidelity is POOLED over members.
# ---------------------------------------------------------------------------------------------------------------------
selection:
    metric: valid_regression_score
    mode: max
    components:
        mae_cond_ss_climatology:      0.60
        psd_full_fidelity:            0.40
