project_uri: 'src/stages'                                                           # the path of the directory where each stage script is saved
log_artifacts: false                                                                # whether to log the output file/directory as artifact
log_models: false                                                                   # whether to log the output model
lazy: true                                                                          # skip a stage whose code state + parameters + input checksums match a
                                                                                    # previously recorded successful run whose outputs are still present and
                                                                                    # byte-identical on disk. Safe and worthwhile here because prepare is
                                                                                    # expensive. Overridable per stage with a `lazy:` key.
                                                                                    # NOTE: the cache keys on the whole-repo dirty diff, so COMMIT before
                                                                                    # running -- any uncommitted edit busts every entry.
ensure_determinism: false                                                           # when a stage is executed with unchanged code+inputs+params but produces a
                                                                                    # different output, that non-determinism is warned about; set true to raise.
                                                                                    # Overridable per stage (`ensure-determinism:`).
banner: true                                                                        # set false to disable the start-up welcome banner entirely
description: 'Flow-matching parameterization of lightning, optionally residual on the deterministic U-net'

# =====================================================================================================================
# Pipeline: FLOW-MATCHING (conditional diffusion) parameterization of lightning from ERA5 reanalysis predictors.
#
# Same diagnostic ERA5 -> lightning mapping and same target as config/deterministic_unet/deterministic_unet.yaml. The model is a
# transformer velocity field trained with the rectified-flow objective, and it generates an ENSEMBLE by taking
# independent ODE draws per item -- so it feeds the same shared ensemble contract as MC-dropout.
#
# TWO MODES, selected by whether an upstream checkpoint is supplied to the preparation stage:
#   FULL-TARGET (UPSTREAM_MODEL unset) : the model learns the entire target.
#   RESIDUAL / knowledge-guided        : prepare_modeling additionally runs the upstream deterministic U-net over
#     every item and stores its target-space prediction as per-day upstream/<date>.npy maps, flagging the directory
#     residual. The diffusion then conditions on that prediction (appended as the LAST conditioning channel, passed
#     as a third batch item) and learns the DISCREPANCY, returning clamp(upstream + residual). The raw targets are
#     untouched, so the baselines, the target statistics and the whole metric suite stay in the target space.
#
#     export UPSTREAM_MODEL=$OUTPUT_ROOT/deterministic_unet/best/best_model.ckpt
#
#   The upstream comes from config/deterministic_unet/deterministic_unet.yaml -- run that pipeline first. Toggling the mode changes the
#   input channel count, so switch output directories (or set overwrite: true on prepare) rather than reusing a
#   directory prepared for the other setting; a stale residual flag would otherwise be picked up silently.
#   `residual_target` in the search space must agree with how the directory was prepared.
#
# Environment: export DATA_ROOT (the dataset root holding metadata.json, metadata.csv, samples/), and UPSTREAM_MODEL
# for residual mode -- leave it unset for the full-target model.
# =====================================================================================================================

stages:
    - setup:
        outputs: '{{$OUTPUT_ROOT}}'
        prepared: '{{$OUTPUT_ROOT}}/diffusion/prepared'
        tuning: '{{$OUTPUT_ROOT}}/diffusion/tuning'
        best: '{{$OUTPUT_ROOT}}/diffusion/best'
        evaluation: '{{$OUTPUT_ROOT}}/diffusion/evaluation'
        reports: '{{$OUTPUT_ROOT}}/diffusion/reports'

    # ------------------------------------------------------------------------------------------------------------
    # 1) Data preparation. Identical to the other two families, plus the optional upstream pass that turns the
    # directory into a residual one.
    # ------------------------------------------------------------------------------------------------------------
    - prepare_modeling:
        data-path: '{{$DATA_ROOT}}'         # dataset root; NEVER hardcode a path
        split-config: config/split/split.yaml     # the shared year-based split (see CLAUDE.md "Data")
        output-path: '{{$OUTPUT_ROOT}}/diffusion/prepared/daily'
        mode: daily                         # daily | hourly
        feature-aggregation: hourly_stack   # stacks 24 hourly maps into C*24 input channels
        features: MU_LI,MU_MIXR,RH_500850,cp,lsm
        hourly-threshold: 2                 # >= 2 strokes for an hour to count (single-stroke denoising); baked
                                            # into the target AND inherited by the residual (never re-applied to it)
        overwrite: false                    # remember to overwrite when changing UPSTREAM_MODEL
        materialize-features: true
        feature-dtype: float16
        upstream-model-path: '{{$UPSTREAM_MODEL}}'  # a deterministic_unet checkpoint -> RESIDUAL mode;
                                            # unset/empty -> FULL-target diffusion
        upstream-accelerator: auto          # accelerator for the one-off upstream prediction pass
        upstream-devices: 1
        upstream-num-workers: 8
        upstream-batch-size: 16

    # ------------------------------------------------------------------------------------------------------------
    # 2) Hyperparameter tuning -- the UNIFIED stage. Ranked on the shared target-space composite, NOT on the
    # validation flow-matching loss: the flow loss lives in the generation space and says nothing about occurrence
    # skill or structure fidelity.
    # ------------------------------------------------------------------------------------------------------------
    - tune:
        model-family: diffusion
        model-type: diffusion               # tagged on the mlflow run for ease of access
        input-path: '{{$OUTPUT_ROOT}}/diffusion/prepared/daily'
        model-config: config/diffusion/search_space.yaml
        metrics-config: config/eval/metrics.yaml # supplies the climatology baseline behind the
                                            # mae_cond_ss_climatology selection component
        output-path: '{{$OUTPUT_ROOT}}/diffusion/tuning'
        metrics-path: '{{$OUTPUT_ROOT}}/diffusion/tuning/best_trial_metrics.json'
        n-trials: 30                        # each trial pays for ODE sampling on the scoring pass
        sampler: tpe                        # random | tpe (tpe requires optuna)
        max-epochs: 50
        early-stopping-patience: 10
        pruning: true
        accelerator: auto
        devices: 1
        num-workers: 8
        progress-bar: true
        feature-stats-days: 256             # train days streamed to fit the feature + generation-space statistics
                                            # baked into every checkpoint

    # ------------------------------------------------------------------------------------------------------------
    # 3) Retrain the winning configuration. A STRUCTURAL mismatch against the source sweep (mode / target /
    # features / residual flag / channel count) is a hard error. The selection metric/mode are read back from
    # source-path/best_trial.json, so they cannot disagree with the sweep.
    # ------------------------------------------------------------------------------------------------------------
    - retrain_best:
        model-family: diffusion
        model-type: diffusion
        source-path: '{{$OUTPUT_ROOT}}/diffusion/tuning'
        input-path: '{{$OUTPUT_ROOT}}/diffusion/prepared/daily'
        metrics-config: config/eval/metrics.yaml
        output-path: '{{$OUTPUT_ROOT}}/diffusion/best'
        metrics-path: '{{$OUTPUT_ROOT}}/diffusion/best/best_trial_metrics.json'
        max-epochs: 80
        early-stopping-patience: 10
        accelerator: auto
        devices: 1
        num-workers: 8
        progress-bar: true

    # ------------------------------------------------------------------------------------------------------------
    # 4) Evaluation and reporting -- THE common evaluation, the same stage and the same metric suite as every other
    # family. In residual mode the module adds the upstream prediction back before scoring, so the metrics are
    # always in the target space and directly comparable to the other two families. In residual mode the six
    # residual_* report figures populate as well; they self-skip otherwise.
    # ------------------------------------------------------------------------------------------------------------
    - evaluate:
        input-path: '{{$OUTPUT_ROOT}}/diffusion/prepared/daily'
        model-path: '{{$OUTPUT_ROOT}}/diffusion/best/best_model.ckpt'
        output-path: '{{$OUTPUT_ROOT}}/diffusion/evaluation'
        metrics-config: config/eval/metrics.yaml
        metrics-path: '{{$OUTPUT_ROOT}}/diffusion/evaluation/test_metrics.json'
        report-path: '{{$OUTPUT_ROOT}}/diffusion/reports'
        split: test                         # valid | test
        baselines: zero,climatology         # no persistence: a diagnostic parameterization has no past observation
        sampling-steps: 50                  # ODE steps per draw at evaluation; more than during tuning, since
                                            # accuracy matters more than speed here
        ensemble-size: 32                   # independent ODE draws per item. Point / skill / categorical /
                                            # calibration scores use the ensemble MEAN; spatial-structure scores are
                                            # POOLED over all N x M members. Cost ~ M x sampling-steps integrations
                                            # per item. Must be >= 2 (spread_skill_sums uses ddof=1).
        accelerator: auto
        devices: 1
        num-workers: 8
        batch-size: 16
        progress-bar: true                  # an ensemble run is much slower than a single-sample eval

tags:                                                                               # tags to be applied to the run
    version: 1.0
    experiment: diffusion
