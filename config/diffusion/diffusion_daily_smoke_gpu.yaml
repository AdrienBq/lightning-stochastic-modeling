project_uri: 'src/stages'                                                           # the path of the directory where each stage script is saved
log_artifacts: false                                                                # whether to log the output file/directory as artifact
log_models: false                                                                   # whether to log the output model
lazy: false                                                                         # NEVER cache a smoke run: the point is to execute every stage
ensure_determinism: false
banner: true
description: 'Flow-matching diffusion -- GPU smoke tier'

# =====================================================================================================================
# GPU SMOKE TIER of config/diffusion/diffusion_daily.yaml. Read that file for what the pipeline does and why, and
# config/deterministic_unet/deterministic_unet_daily_smoke_gpu.yaml for the full list of smoke overrides and their rationale.
#
# 18 mid-July days (10 train / 4 valid / 4 test), 2 trials, 1 epoch, accelerator gpu, bf16-mixed, ensemble-size 5,
# sampling-steps 16 (a GPU can afford more ODE steps than the CPU tier's 8, so generation is exercised closer to how
# it will actually run).
#
# RESIDUAL MODE: to smoke-test the residual path, run config/deterministic_unet/deterministic_unet_daily_smoke_gpu.yaml first and point
# UPSTREAM_MODEL at ITS checkpoint -- not at a real one, whose feature normalization was fitted on different days:
#
#     export UPSTREAM_MODEL=$OUTPUT_ROOT/deterministic_unet_smoke_gpu/best/best_model.ckpt
#
# Changing UPSTREAM_MODEL changes the input channel count, so delete $OUTPUT_ROOT/diffusion_smoke_gpu/prepared (or set
# overwrite: true) when toggling it.
#
# Environment: export DATA_ROOT before running; UPSTREAM_MODEL only for the residual smoke variant.
# =====================================================================================================================

stages:
    - setup:
        outputs: '{{$OUTPUT_ROOT}}'
        prepared: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/prepared'
        tuning: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/tuning'
        best: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/best'
        evaluation: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/evaluation'
        reports: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/reports'

    - prepare_modeling:
        data-path: '{{$DATA_ROOT}}'
        split-config: config/split/split_smoke_gpu.yaml
        output-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/prepared/daily'
        mode: daily
        feature-aggregation: hourly_stack
        features: MU_LI,MU_MIXR,RH_500850,cp,lsm
        hourly-threshold: 2
        overwrite: false
        materialize-features: true
        feature-dtype: float16
        upstream-model-path: '{{$UPSTREAM_MODEL}}'  # unset/empty -> FULL-target smoke run
        upstream-accelerator: gpu
        upstream-devices: 1
        upstream-num-workers: 8
        upstream-batch-size: 4

    - tune:
        model-family: diffusion
        model-type: diffusion
        input-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/prepared/daily'
        model-config: config/diffusion/search_space_daily.yaml
        metrics-config: config/eval/metrics_daily.yaml
        output-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/tuning'
        metrics-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/tuning/best_trial_metrics.json'
        n-trials: 2
        sampler: tpe
        max-epochs: 1
        early-stopping-patience: 1
        pruning: false
        restart: true                       # ALWAYS sweep from trial 0. run_sweep resumes from the optuna store
                                            # in output-path, which the pipeline's `lazy: false` does NOT govern --
                                            # so a re-run silently skipped every trial and restored the previous
                                            # best, defeating a tier whose purpose is to execute every stage.
        accelerator: gpu
        devices: 1
        num-workers: 8
        precision: bf16-mixed
        progress-bar: true
        feature-stats-days: 10              # cannot exceed the 10 train days of the smoke split

    - retrain_best:
        model-family: diffusion
        model-type: diffusion
        source-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/tuning'
        input-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/prepared/daily'
        metrics-config: config/eval/metrics_daily.yaml
        output-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/best'
        metrics-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/best/best_trial_metrics.json'
        max-epochs: 1
        early-stopping-patience: 1
        accelerator: gpu
        devices: 1
        num-workers: 8
        precision: bf16-mixed
        progress-bar: true

    - evaluate:
        input-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/prepared/daily'
        model-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/best/best_model.ckpt'
        output-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/evaluation'
        metrics-config: config/eval/metrics_daily.yaml
        metrics-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/evaluation/test_metrics.json'
        report-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_gpu/reports'
        split: test
        baselines: zero,climatology
        sampling-steps: 16
        ensemble-size: 5                    # NEVER 1: spread_skill_sums uses ddof=1, so M=1 yields a silent NaN
        accelerator: gpu
        devices: 1
        num-workers: 8
        batch-size: 4
        progress-bar: true

tags:                                                                               # tags to be applied to the run
    version: 1.0
    experiment: diffusion_smoke_gpu
