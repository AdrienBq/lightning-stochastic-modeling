project_uri: 'src/stages'                                                           # the path of the directory where each stage script is saved
log_artifacts: false                                                                # whether to log the output file/directory as artifact
log_models: false                                                                   # whether to log the output model
lazy: false                                                                         # NEVER cache a smoke run: the point is to execute every stage
ensure_determinism: false
banner: true
description: 'Flow-matching diffusion -- CPU smoke tier'

# =====================================================================================================================
# CPU SMOKE TIER of config/diffusion/diffusion.yaml. Read that file for what the pipeline does and why, and
# config/deterministic_unet/deterministic_unet_smoke_cpu.yaml for the full list of smoke overrides and their rationale.
#
# RESIDUAL MODE in the smoke tier: leave UPSTREAM_MODEL unset for the plain full-target smoke run. To smoke-test the
# residual path as well, point it at the CPU smoke tier's own upstream checkpoint -- NOT at a real one, whose feature
# normalization was fitted on different days:
#
#     export UPSTREAM_MODEL=$OUTPUT_ROOT/deterministic_unet_smoke_cpu/best/best_model.ckpt
#
# and run config/deterministic_unet/deterministic_unet_smoke_cpu.yaml first. Changing UPSTREAM_MODEL changes the input channel count, so
# delete $OUTPUT_ROOT/diffusion_smoke_cpu/prepared (or set overwrite: true) when toggling it.
#
# `sampling-steps` is cut to 8: ODE integration is the dominant cost of a CPU diffusion evaluation, and the smoke run
# is checking that generation runs at all, not that it converges.
#
# Environment: export DATA_ROOT before running; UPSTREAM_MODEL only for the residual smoke variant.
# =====================================================================================================================

stages:
    - setup:
        outputs: '{{$OUTPUT_ROOT}}'
        prepared: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/prepared'
        tuning: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/tuning'
        best: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/best'
        evaluation: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/evaluation'
        reports: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/reports'

    - prepare_modeling:
        data-path: '{{$DATA_ROOT}}'
        split-config: config/split/split_smoke_cpu.yaml
        output-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/prepared/daily'
        mode: daily
        feature-aggregation: hourly_stack
        features: MU_LI,MU_MIXR,RH_500850,cp,lsm
        hourly-threshold: 2
        overwrite: false
        materialize-features: true
        feature-dtype: float32
        upstream-model-path: '{{$UPSTREAM_MODEL}}'  # unset/empty -> FULL-target smoke run
        upstream-accelerator: cpu
        upstream-devices: 1
        upstream-num-workers: 0
        upstream-batch-size: 2

    - tune:
        model-family: diffusion
        model-type: diffusion
        input-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/prepared/daily'
        model-config: config/diffusion/search_space.yaml
        metrics-config: config/eval/metrics.yaml
        output-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/tuning'
        metrics-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/tuning/best_trial_metrics.json'
        n-trials: 1
        sampler: random
        max-epochs: 1
        early-stopping-patience: 1
        pruning: false
        accelerator: cpu
        devices: 1
        num-workers: 0
        progress-bar: true
        feature-stats-days: 4               # cannot exceed the 4 train days of the smoke split

    - retrain_best:
        model-family: diffusion
        model-type: diffusion
        source-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/tuning'
        input-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/prepared/daily'
        metrics-config: config/eval/metrics.yaml
        output-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/best'
        metrics-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/best/best_trial_metrics.json'
        max-epochs: 1
        early-stopping-patience: 1
        accelerator: cpu
        devices: 1
        num-workers: 0
        progress-bar: true

    - evaluate:
        input-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/prepared/daily'
        model-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/best/best_model.ckpt'
        output-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/evaluation'
        metrics-config: config/eval/metrics.yaml
        metrics-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/evaluation/test_metrics.json'
        report-path: '{{$OUTPUT_ROOT}}/diffusion_smoke_cpu/reports'
        split: test
        baselines: zero,climatology
        sampling-steps: 8                   # minimum viable ODE integration; cost is M x steps per item on CPU
        ensemble-size: 2                    # NEVER 1: spread_skill_sums uses ddof=1, so M=1 yields a silent NaN.
                                            # 2 is the minimum that still populates the ensemble metric group.
        accelerator: cpu
        devices: 1
        num-workers: 0
        batch-size: 2
        progress-bar: true

tags:                                                                               # tags to be applied to the run
    version: 1.0
    experiment: diffusion_smoke_cpu
