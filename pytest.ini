[pytest]
# `testpaths` pins pytest's rootdir to the repo root, which is what makes tests/conftest.py's sys.path insert
# predictable, and stops a bare `pytest` from walking outputs/ and the venv.
#
# There is deliberately NO `python_files` override: the suite names its files <module>_test.py, which is already one
# of pytest's two default patterns (`test_*.py` and `*_test.py`). The plural `*_tests.py` is NOT a default, and would
# have needed an override here whose absence collects zero tests and exits 0 — indistinguishable from a green run.
testpaths = tests

# Line coverage is the MEASURE; `tests/completeness_test.py`'s every-function gate is only the floor. The two catch
# different things and disagree in both directions — `run.py` has every function referenced and 57 % of its lines
# executed, while `search.py` and `mc_dropout_module.py` are at 100 % of lines with functions no test names.
#
# The floor is set below the measured figure (85.8 % at the end of Step 3 block 5c), not at a round aspiration:
# it exists to catch a REGRESSION, and a threshold nobody can meet gets raised rather than respected. Raise it when
# a step genuinely lifts the number.
#
# ⚠️ The residue is concentrated in `tuning.py` (25 %) and `stages/run.py` (57 %) — the sweep harness and the two
# orchestration backends — and block 4g found the usual explanation for it to be HALF WRONG. It is not that no test
# reaches them: `tests/pipeline_e2e_test.py` drives both end to end, in SUBPROCESSES that pytest-cov does not trace.
# `coverage`'s subprocess hook (`a1_coverage.pth`) is already installed, so one variable turns it on:
#
#     COVERAGE_PROCESS_START=<a coveragerc with `parallel = true`> pytest tests/ -q
#
#                        default    with the hook
#     whole suite        87.62 %       93.84 %
#     tuning.py             25 %          71 %
#     stages/run.py         57 %          75 %
#     stages/__init__.py    47 %         100 %
#
# 291 of the 579 "missed" lines therefore execute on every run and are simply not counted. What genuinely needs a live
# tracking server and a real fit is the remaining 288 — still 175 of them in those two modules.
#
# ⚠️ THE FLOOR BELOW IS CHECKED IN THE DEFAULT MODE, so it must be set against 87.62 % and NOT against 93.84 %.
# Raising it to the true figure would fail every ordinary `pytest tests/` run.
#
# ⚠️ The floor applies to the WHOLE suite, so a partial run trips it: `pytest tests/utils/io/lazy_test.py` measures
# one file against all of src/ and reports ~0 %, failing the gate. That is arithmetic, not a regression — pass
# `--no-cov` when running a subset:
#
#     pytest tests/utils/io/lazy_test.py -q --no-cov      # iterating on one file
#     pytest tests/ -q                                    # the real gate
#
# Keeping the floor in `addopts` rather than in a CI-only command is deliberate: a threshold nobody runs is not a
# gate. The cost is having to remember --no-cov, which is cheaper than a coverage number that silently stops being
# checked.
addopts = --cov=src --cov-report=term-missing --cov-fail-under=85

# `source_invariant` marks the tests that assert on SOURCE TEXT (AST / tokenize) rather than on behaviour: that an
# identifier removed by the three-branch merge stayed removed, that a function delegates rather than re-implements, that
# a config key is spelled the way the code reads it. They are MERGE GUARDS, not behavioural tests.
#
# ⚠️ They are meant to be deleted as a group once the rebuild is history — `pytest -m 'not source_invariant'` shows what
# the suite proves without them, and `grep -rn source_invariant tests/` finds every one. See the retirement note in
# .claude/plans/rebuild-plan.md; do not retire them piecemeal, since the value is in the set.
markers =
    source_invariant: asserts on source text rather than behaviour — a merge guard, retired as a group (rebuild-plan.md)

# Third-party deprecations we cannot act on. cartopy's gridline ticker emits one MatplotlibDeprecationWarning per
# label per figure, which is ~5000 lines across the map tests and buries anything real.
filterwarnings =
    ignore:The locs attribute was deprecated:DeprecationWarning
    ignore:The locs attribute was deprecated:PendingDeprecationWarning
    ignore:The set_bad function will be deprecated:PendingDeprecationWarning
