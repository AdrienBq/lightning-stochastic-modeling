# Conda path for lightning-stochastic-modeling. Conda supplies ONLY the interpreter; pip installs
# `minimal_requirements.txt`, which stays the single source of truth for dependencies.
#
#   conda env create -f environment.yml
#   conda activate lightning-stochastic-modeling
#
# ⚠️ The one rule here is that this file must NOT list packages that `minimal_requirements.txt` lists. Two enumerations
# of the same dependency set is the failure mode of "add conda support": they agree on the day they are written and
# diverge on the first version bump, after which a conda user and a pip user run different code and the difference shows
# up as an unreproducible result rather than an install error. `tests/environment_test.py` enforces the rule.
#
# The cost accepted for that: conda-forge builds of the compiled stack (torch, cartopy's GEOS/PROJ) are often better
# behaved on old cluster nodes than manylinux wheels, and this file gives them up. If a node hits the
# `GLIBCXX_3.4.29` wall (see minimal_requirements.txt), the first thing to try is still the LD_LIBRARY_PATH export
# documented there; pinning the stack through conda-forge instead means accepting the second list.
name: lightning-stochastic-modeling
channels:
  - conda-forge
dependencies:
  # 3.11 is what the test suite runs on; 3.12 also works.
  - python=3.11
  - pip
  - pip:
      # Relative to THIS file's directory, so it resolves wherever the repo is cloned.
      - -r minimal_requirements.txt
